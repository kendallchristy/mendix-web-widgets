packages:
    - "packages/widgets/*"
    - "packages/shared/*"
    - "packages/templates/*"
    - "packages/demos/*"

# One version of each shared dependency for every widget. Reference these
# from a package.json with "catalog:" instead of a version number.
catalog:
    "@mendix/pluggable-widgets-tools": "11.15.0"
    "@testing-library/jest-dom": "^6.9.1"
    "@testing-library/react": "^16.3.2"
    "@testing-library/user-event": "^14.6.1"
    # Drag and drop engine for the drag and drop widgets (packages/shared/dnd-core)
    "@atlaskit/pragmatic-drag-and-drop": "^4.0.0"
    "@atlaskit/pragmatic-drag-and-drop-hitbox": "^3.0.0"
    # List windowing (Data Grid Pro, drag and drop widgets)
    "@tanstack/react-virtual": "^3.14.22"
    # Decimal numbers. Mendix provides it at runtime, so the widget build leaves it out of the bundle.
    big.js: "6.2.2"
    classnames: "^2.5.1"
    # Charting library for the chart widgets (packages/shared/chart-core)
    echarts: "^6.1.0"
    # Widget API types. Keep in step with the tools version.
    mendix: "11.16.0"
    # The Mendix widget tooling targets TypeScript 5.x
    typescript: "~5.9.3"

# The widget tooling brings React 19 types. Keep a single copy so React types from
# different packages stay compatible with each other.
overrides:
    "@types/react": "^19.2.18"
    "@types/react-dom": "^19.2.3"
