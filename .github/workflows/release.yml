name: Release

on:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

env:
    TURBO_TELEMETRY_DISABLED: 1

jobs:
    release:
        name: Version or release widgets
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # While changesets are pending, this opens or updates a "Version widgets"
            # pull request. Once that is merged, it publishes a GitHub release with the
            # .mpk for each widget whose new version has no release yet.
            - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: pnpm version-packages
                  publish-script: pnpm github-release
                  pr-title: Version widgets
                  commit-message: Version widgets
                  create-github-releases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
