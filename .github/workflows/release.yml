name: Release

on:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

env:
    TURBO_TELEMETRY_DISABLED: 1

jobs:
    release:
        name: Version or release widgets
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
            - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # While changesets are pending, this opens or updates a "Version widgets"
            # pull request. Once that is merged, it publishes a GitHub release with the
            # .mpk for each widget whose new version has no release yet.
            - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  version: pnpm version-packages
                  publish: pnpm github-release
                  title: Version widgets
                  commit: Version widgets
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
